# Local 9-node / 3-shard / RF=3 SamanvayDB cluster (the demo topology).
#
#   bash scripts/cluster-up.sh      # build + start + wait for leaders
#   bash scripts/cluster-down.sh    # stop + delete volumes
#
# Inside the network nodes reach each other as node-N:7000. From the host,
# node N's gRPC port is 700N and its HTTP port (/metrics, /status) is 800N.
# Note: the shard map advertises node-N:7000 addresses, so host-side clients
# (kvctl) should run inside the network — scripts/cluster-up.sh does this
# with `docker compose exec`.

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: samanvaydb:latest
  restart: "no"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  node-1:
    <<: *node
    hostname: node-1
    command: ["-config", "/configs/node-1.yaml"]
    ports:
      - "7001:7000"
      - "8001:8080"
    volumes:
      - ../configs/docker:/configs:ro
      - node-1-data:/data

  node-2:
    <<: *node
    hostname: node-2
    command: ["-config", "/configs/node-2.yaml"]
    ports:
      - "7002:7000"
