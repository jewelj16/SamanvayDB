// Node-to-node Raft RPCs.
//
// A single gRPC connection between two nodes carries traffic for every
// shard they co-host, so every message carries shard_id and the receiving
// transport dispatches on it (never "one connection == one shard").
// `from` is the sending node's ID, used by the fault injector to enforce
// partitions on the receive side as well as the send side.
syntax = "proto3";

package samanvaydb.raft;

option go_package = "samanvaydb/proto/raftpb";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  uint32 type = 3;
  bytes data = 4;
}

message RequestVoteRequest {
  int32 shard_id = 1;
  string from = 2;
  uint64 term = 3;
  string candidate_id = 4;
  uint64 last_log_index = 5;
  uint64 last_log_term = 6;
  bool pre_vote = 7;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int32 shard_id = 1;
  string from = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 prev_log_index = 5;
  uint64 prev_log_term = 6;
  repeated Entry entries = 7;
  uint64 leader_commit = 8;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

message InstallSnapshotRequest {
  int32 shard_id = 1;
  string from = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 last_included_index = 5;
  uint64 last_included_term = 6;
  // Raft membership configuration as of last_included_index (raft-encoded).
  bytes config = 7;
  bytes data = 8;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
